name: Release BottleForge

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
    paths:
      - ".release-tag"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente para publicar"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            git checkout "$TAG"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(tr -d '[:space:]' < .release-tag)"
            [[ "$TAG" == v* ]] || {
              echo "Tag inválida em .release-tag: $TAG" >&2
              exit 2
            }

            git fetch --tags origin
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "A tag $TAG já existe." >&2
              exit 3
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "BottleForge $TAG"
            git push origin "$TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bootstrap engines
        shell: bash
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/bootstrap-engines.sh

      - name: Bootstrap Laya
        shell: bash
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/bootstrap-laya.sh

      - name: Bootstrap D3D12
        shell: bash
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            brew install zstd
          fi
          chmod +x Scripts/*.sh
          ./Scripts/bootstrap-d3d12.sh

      - name: Install Steam compatibility compiler
        shell: bash
        run: |
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            brew install mingw-w64
          fi

      - name: Build app
        shell: bash
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/build-app.sh "${{ steps.version.outputs.tag }}"

      - name: Package DMG
        shell: bash
        run: |
          ./Scripts/package-dmg.sh "${{ steps.version.outputs.tag }}"
          cd release
          shasum -a 256 BottleForge-*-macOS.dmg > SHA256SUMS.txt

      - name: Verify artifact
        shell: bash
        run: |
          codesign --verify --deep --strict dist/BottleForge.app
          test -s release/SHA256SUMS.txt
          ls -lh release/BottleForge-*-macOS.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          DMG="release/BottleForge-$TAG-macOS.dmg"
          FLAGS=()

          if [[ "$TAG" == *-alpha* || "$TAG" == *-beta* || "$TAG" == *-rc* ]]; then
            FLAGS+=(--prerelease)
          fi

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --title "BottleForge $TAG"               --generate-notes               "${FLAGS[@]}"
            sleep 3
          fi

          DMG_NAME="$(basename "$DMG")"
          LOCAL_SIZE="$(stat -f%z "$DMG")"
          uploaded=0

          for attempt in 1 2 3; do
            gh release upload "$TAG" "$DMG"               --clobber               --repo "$GITHUB_REPOSITORY" || true

            sleep 3

            REMOTE_SIZE="$(gh api               "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"               --jq ".assets[] | select(.name == \"$DMG_NAME\") | .size"               | head -1)"

            if [[ "$REMOTE_SIZE" == "$LOCAL_SIZE" ]]; then
              uploaded=1
              break
            fi

            echo "Tentativa $attempt de 3: DMG remoto ausente ou incompleto." >&2
            sleep $((attempt * 5))
          done

          if [[ "$uploaded" -ne 1 ]]; then
            echo "Upload do DMG falhou após 3 tentativas." >&2
            exit 30
          fi

          gh release upload "$TAG" release/SHA256SUMS.txt             --clobber             --repo "$GITHUB_REPOSITORY"

          REMOTE_DMG="$(gh api             "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"             --jq ".assets[] | select(.name == \"$DMG_NAME\" and .state == \"uploaded\") | .name")"

          [[ "$REMOTE_DMG" == "$DMG_NAME" ]] || {
            echo "DMG não ficou disponível na release." >&2
            exit 31
          }
